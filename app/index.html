<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark" data-view="sys">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HoldVue</title>
<link rel="icon" href="/assets/holdvue.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root, html[data-theme="light"]{
  --bg:#e8f5ea; --bg2:#d9efdd; --text:#1a1a1a; --muted:#3d5a45;
  --line:#7cb88a; --card:#ffffffcc; --accent:#2f7d4a; --ok:#1f8f3a; --danger:#c62828;
  --fill:#ffffffaa; --shadow:0 6px 18px rgba(0,0,0,.12);
}
html[data-theme="dark"]{
  --bg:#1c1c1e; --bg2:#252528; --text:#f5f5f7; --muted:#a1a1a6;
  --line:#3a3a3c; --card:#2c2c2ecc; --accent:#0a84ff; --ok:#30d158; --danger:#ff453a;
  --fill:#3a3a3caa; --shadow:0 8px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box; scrollbar-width:none !important; -ms-overflow-style:none !important}
*::-webkit-scrollbar{display:none !important; width:0 !important; height:0 !important}
html,body{height:100%; margin:0; overflow:hidden; background:transparent; color:var(--text);
  font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; user-select:none}
.hidden{display:none !important}

/* ===== Minimal float (TrafficMonitor style) ===== */
.mini{
  height:100%; width:100%;
  display:flex; flex-direction:column;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  box-shadow:var(--shadow);
  overflow:hidden;
  cursor:default;
  container-type:inline-size;
  container-name:mini;
}
.mini-grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:10px;
  row-gap:2px;
  padding:8px 12px;
  align-content:center;
}
.mini-cell{
  display:flex; align-items:baseline; gap:4px;
  padding:2px 0;
  font-size:12.5px; line-height:1.3; white-space:nowrap;
  overflow:visible; min-width:0;
}
.mini-cell .k{color:var(--muted); font-weight:500; flex:0 0 auto}
.mini-cell .v{font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  overflow:visible}
.mini-cell .chg{font-weight:600; font-variant-numeric:tabular-nums; font-size:11px;
  letter-spacing:-.02em; flex:0 0 auto}
.mini-cell .chg.up{color:var(--ok)}
.mini-cell .chg.down{color:var(--danger)}
.mini-cell .chg.flat{color:var(--muted)}
/* 台股：紅漲綠跌；美股／加密：綠漲紅跌（預設） */
.mini-cell.mkt-tw .chg.up{color:var(--danger)}
.mini-cell.mkt-tw .chg.down{color:var(--ok)}
html.lowcontrast .mini-cell .chg.up,
html.lowcontrast .mini-cell .chg.down,
html.lowcontrast .mini-cell.mkt-tw .chg.up,
html.lowcontrast .mini-cell.mkt-tw .chg.down{color:var(--muted)}
.mini-cell .sess{
  flex:0 0 auto; font-size:10px; font-weight:600; line-height:1;
  padding:2px 5px; border-radius:4px; border:1px solid var(--line);
  color:var(--muted); background:var(--fill); letter-spacing:.02em;
}
.mini-cell .sess.pre{color:#f5a623; border-color:rgba(245,166,35,.45); background:rgba(245,166,35,.12)}
.mini-cell .sess.reg{color:var(--ok); border-color:rgba(48,209,88,.4); background:rgba(48,209,88,.12)}
.mini-cell .sess.post{color:var(--accent); border-color:rgba(10,132,255,.4); background:rgba(10,132,255,.12)}
.mini-cell .sess.closed{color:var(--muted)}
.mini-cell .sess.h24{color:var(--muted)}
html.lowcontrast .mini-cell .sess,
html.lowcontrast .mini-cell .sess.pre,
html.lowcontrast .mini-cell .sess.reg,
html.lowcontrast .mini-cell .sess.post,
html.lowcontrast .mini-cell .sess.closed,
html.lowcontrast .mini-cell .sess.h24{
  color:var(--muted); border-color:var(--line); background:var(--fill);
}
/* 預設單欄；夠寬才兩欄（門檻較嚴，避免並排左右大片留白） */
.mini[data-mode="stock"] .mini-grid{
  grid-template-columns:1fr;
  align-content:start;
  overflow:auto;
  padding:6px 8px;
  column-gap:12px;
  row-gap:3px;
}
.mini[data-mode="stock"] .mini-cell{
  font-size:12px;
  padding:2px 0;
  gap:6px;
  width:100%;
  box-sizing:border-box;
}
@container mini (min-width: 560px){
  .mini[data-mode="stock"] .mini-grid{
    grid-template-columns:1fr 1fr;
  }
  /* 兩欄時把標籤／價格／漲跌／盤別撐滿欄寬，減少右側空洞 */
  .mini[data-mode="stock"] .mini-cell{
    justify-content:space-between;
  }
}
.mini-lock{
  position:absolute; top:4px; right:6px; width:7px; height:7px; border-radius:50%;
  background:var(--ok); opacity:0; transition:opacity .2s;
  pointer-events:none;
}
.mini.is-locked .mini-lock{opacity:.85; background:#f5a623}
.mini-hint{
  position:absolute; left:0; right:0; bottom:2px; text-align:center;
  font-size:9px; color:var(--muted); opacity:0; pointer-events:none;
  transition:opacity .25s;
}
.mini.show-hint .mini-hint{opacity:.8}

/* Context menu */
.ctx{
  position:fixed; z-index:100; min-width:168px;
  background:var(--bg); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:4px; display:none;
}
.ctx.open{display:block}
.ctx button{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  color:var(--text); font:inherit; font-size:12.5px; padding:8px 10px;
  border-radius:7px; cursor:pointer;
}
.ctx button:hover{background:var(--fill)}
.ctx .sep{height:1px; background:var(--line); margin:4px 6px}
.ctx .dim{color:var(--muted); font-size:11px; padding:4px 10px 6px}

/* Full dashboard (settings / expanded) */
.full{
  height:100%; overflow:auto; background:var(--bg);
  padding:14px 14px 60px; color:var(--text);
}
.full .hero{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
html.widget.fullmode .full .hero{
  cursor:grab;
  user-select:none;
  padding:4px 2px 8px;
  margin:-4px -2px 12px;
  border-radius:8px;
}
html.widget.fullmode .full .hero:active{cursor:grabbing}
.full .brand{display:flex; gap:10px; align-items:center}
.full .brand img{width:36px; height:36px; border-radius:10px}
.full h1{margin:0; font-size:1.25rem; letter-spacing:-.03em}
.full .tabs{display:inline-flex; padding:3px; border-radius:980px; background:var(--fill); margin-bottom:12px}
.full .tabs button{border:0; background:transparent; color:var(--muted); font:inherit; font-size:.82rem;
  padding:6px 12px; border-radius:980px; cursor:pointer}
.full .tabs button.active{background:var(--card); color:var(--text)}
.board{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px}
.card .label{color:var(--muted); font-size:.75rem}
.card .price{margin-top:6px; font-size:1.25rem; font-weight:600; font-variant-numeric:tabular-nums}
.card .meta{margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.card .chg{font-size:.8rem; font-weight:600; font-variant-numeric:tabular-nums}
.card .chg.up{color:var(--ok)} .card .chg.down{color:var(--danger)} .card .chg.flat{color:var(--muted)}
.card.mkt-tw .chg.up{color:var(--danger)} .card.mkt-tw .chg.down{color:var(--ok)}
html.lowcontrast .card .chg.up,
html.lowcontrast .card .chg.down,
html.lowcontrast .card.mkt-tw .chg.up,
html.lowcontrast .card.mkt-tw .chg.down{color:var(--muted)}
.card .sess{
  font-size:.68rem; font-weight:600; padding:2px 6px; border-radius:4px;
  border:1px solid var(--line); color:var(--muted); background:var(--fill);
}
.card .sess.pre{color:#f5a623; border-color:rgba(245,166,35,.45); background:rgba(245,166,35,.12)}
.card .sess.reg{color:var(--ok); border-color:rgba(48,209,88,.4); background:rgba(48,209,88,.12)}
.card .sess.post{color:var(--accent); border-color:rgba(10,132,255,.4); background:rgba(10,132,255,.12)}
.card .sess.closed,.card .sess.h24{color:var(--muted)}
html.lowcontrast .card .sess,
html.lowcontrast .card .sess.pre,
html.lowcontrast .card .sess.reg,
html.lowcontrast .card .sess.post,
html.lowcontrast .card .sess.closed,
html.lowcontrast .card .sess.h24{
  color:var(--muted); border-color:var(--line); background:var(--fill);
}
.sys{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px}
.settings .toolbar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.settings .ord{display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
.settings .ord-btns{display:inline-flex; flex-direction:column; gap:1px}
.settings .ord-btns button{
  border:0; background:var(--fill); color:var(--muted); cursor:pointer;
  width:18px; height:14px; padding:0; border-radius:4px; font-size:9px; line-height:1;
}
.settings .ord-btns button:hover{color:var(--text); background:var(--card)}
.settings .ord-btns button:disabled{opacity:.35; cursor:default}
.settings button{border:0; border-radius:980px; padding:7px 12px; font:inherit; font-size:.8rem; cursor:pointer}
.btn-primary{background:var(--accent); color:#fff}
.btn-secondary{background:var(--fill); color:var(--text)}
.btn-danger{background:rgba(255,59,48,.12); color:var(--danger)}
.settings table{width:100%; border-collapse:collapse}
.settings th,.settings td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:.8rem}
.settings .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px}
.settings input,.settings select{flex:1; min-width:90px; border:1px solid var(--line); background:var(--bg);
  color:var(--text); border-radius:8px; padding:7px 9px; font:inherit; font-size:.8rem}
.toast{min-height:1.1em; margin-top:8px; color:var(--muted); font-size:.8rem}
.ok{color:var(--ok)} .bad{color:var(--danger)}
.settings tr.row-msg td{padding:0 6px 8px; border-bottom:1px solid var(--line); font-size:.78rem}
.settings tr.row-msg .row-toast{min-height:0; padding:2px 4px 0; color:var(--muted)}
.settings tr.row-msg .row-toast.ok{color:var(--ok)}
.settings tr.row-msg .row-toast.bad{color:var(--danger)}
.settings tr.row-msg:not(.show){display:none}
.theme-toggle{
  position:fixed; right:12px; bottom:12px; z-index:40; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer;
  display:grid; place-items:center;
}
html[data-theme="light"] .icon-moon{display:none}
html[data-theme="dark"] .icon-sun{display:none}
/* 極簡浮動視窗：隱藏主題鈕，避免擋住網速／記憶體文字（改用右鍵切換） */
html.widget:not(.fullmode) .theme-toggle{display:none !important}
html:not(.widget) .mini{display:none}
html.widget .full{display:none}
html.widget.fullmode .mini{display:none}
html.widget.fullmode .full{display:block}
/* 僅左下／右下可拉尺寸 */
.resize-handle{
  position:fixed; z-index:60; width:16px; height:16px;
  bottom:0; opacity:0;
}
.resize-handle.se{right:0; cursor:nwse-resize}
.resize-handle.sw{left:0; cursor:nesw-resize}
html:not(.widget) .resize-handle{display:none !important}
</style>
</head>
<body>
  <!-- Minimal float -->
  <div class="mini" id="mini" data-mode="sys">
    <span class="mini-lock" title="已鎖定"></span>
    <div class="mini-grid" id="miniGrid"></div>
    <div class="mini-hint" id="miniHint"></div>
  </div>

  <!-- Full UI -->
  <div class="full" id="full">
    <header class="hero">
      <div class="brand">
        <img src="/assets/holdvue.png" alt=""/>
        <div><h1>HoldVue</h1></div>
      </div>
      <div id="updatedFull" style="font-size:.75rem;color:var(--muted)">同步中</div>
    </header>
    <nav class="tabs">
      <button class="active" type="button" data-tab="board">觀測看板</button>
      <button type="button" data-tab="settings">標的設定</button>
    </nav>
    <section id="tab-board">
      <div class="sys">
        <div class="card"><div class="label">CPU</div><div class="price" id="cpu">--%</div></div>
        <div class="card"><div class="label">記憶體</div><div class="price" id="ram">--%</div></div>
      </div>
      <div class="board" id="board"></div>
    </section>
    <section id="tab-settings" class="settings hidden">
      <div class="card">
        <div class="toolbar">
          <button class="btn-danger" type="button" onclick="removeSelected()">刪除</button>
          <button class="btn-primary" type="button" onclick="saveConfig()">儲存設定</button>
          <button class="btn-secondary" type="button" onclick="refreshAll()">重新整理</button>
          <button class="btn-secondary" type="button" onclick="exitFullMode()">返回極簡</button>
        </div>
        <table><thead><tr><th>#</th><th>名稱</th><th>來源</th><th>代碼</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
        <div class="row"><strong style="font-size:.85rem">新增標的</strong></div>
        <div class="row">
          <label>名稱</label><input id="newLabel" placeholder="0050"/>
          <label>來源</label>
          <select id="newSource"><option value="yahoo">Yahoo</option><option value="coingecko">CoinGecko</option></select>
        </div>
        <div class="row">
          <label>代碼</label><input id="newCode" placeholder="0050.TW"/>
          <label>前綴</label><input id="newPrefix" placeholder="$" style="max-width:64px"/>
          <button class="btn-primary" type="button" onclick="addSymbol()">加入</button>
          <button class="btn-secondary" type="button" onclick="testNew()">驗證</button>
        </div>
        <div class="toast" id="toast"></div>
        <div class="toast" id="testResult"></div>
      </div>
    </section>
  </div>

  <div class="ctx" id="ctx">
    <div class="dim" id="ctxStatus">極簡浮動視窗</div>
    <button type="button" data-act="toggle" data-stock="1">切換顯示</button>
    <button type="button" data-act="theme">切換深淺色</button>
    <button type="button" data-act="topmost">永遠置頂</button>
    <button type="button" data-act="clickthrough">左鍵穿透</button>
    <button type="button" data-act="lowcontrast">低對比</button>
    <div class="sep"></div>
    <button type="button" data-act="size-sys">尺寸：系統列</button>
    <button type="button" data-act="size-stock" data-stock="1">尺寸：股票列</button>
    <button type="button" data-act="full" data-stock="1">完整介面 / 設定</button>
    <div class="sep" data-stock="1"></div>
    <button type="button" data-act="reload">重新整理</button>
    <div class="sep"></div>
    <button type="button" data-act="hide">隱藏到系統匣</button>
    <button type="button" data-act="exit">結束 HoldVue</button>
  </div>

  <button class="theme-toggle" type="button" id="themeToggle" title="主題">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
  </button>
  <div class="resize-handle sw" data-edge="sw" title="調整大小"></div>
  <div class="resize-handle se" data-edge="se" title="調整大小"></div>

<script>
const root=document.documentElement;
const params=new URLSearchParams(location.search);
const isWidget=params.has('widget');
if(isWidget) root.classList.add('widget');

const savedTheme=localStorage.getItem('holdvue-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
root.setAttribute('data-theme', savedTheme);

let cfg={symbols:[]};
let quotes={};
let selected=-1;
let viewMode=localStorage.getItem('holdvue-view') || 'sys'; // sys | stock
let locked=localStorage.getItem('holdvue-lock')==='1';
let lowContrast=localStorage.getItem('holdvue-lowcontrast')==='1';
let clickTimes=[];
let sizeFitDone=false;
const TRIPLE_MS=650;
if(lowContrast) root.classList.add('lowcontrast');

function post(msg){
  try{
    if(window.holdvueDesktop){
      const m=typeof msg==='string'?{cmd:msg}:msg;
      if(m.cmd==='menu') return holdvueDesktop.menu(!!m.locked);
      if(m.cmd==='drag') return holdvueDesktop.drag();
      if(m.cmd==='dragMove') return holdvueDesktop.dragMove && holdvueDesktop.dragMove();
      if(m.cmd==='dragEnd') return holdvueDesktop.dragEnd && holdvueDesktop.dragEnd();
      if(m.cmd==='resizeStart') return holdvueDesktop.resizeStart && holdvueDesktop.resizeStart(m.edge);
      if(m.cmd==='resizeMove') return holdvueDesktop.resizeMove && holdvueDesktop.resizeMove();
      if(m.cmd==='resizeEnd') return holdvueDesktop.resizeEnd && holdvueDesktop.resizeEnd();
      if(m.cmd==='resize') return holdvueDesktop.resize(m.w, m.h, !!m.chrome);
      if(m.cmd==='chrome') return holdvueDesktop.chrome(!!m.on);
      if(m.cmd==='hide') return holdvueDesktop.hide();
      if(m.cmd==='clickthrough') return holdvueDesktop.clickThrough && holdvueDesktop.clickThrough();
      if(m.cmd==='exit') return;
    }
    if(window.chrome && chrome.webview && chrome.webview.postMessage)
      chrome.webview.postMessage(typeof msg==='string'?msg:JSON.stringify(msg));
  }catch{}
}

function setTheme(t){
  root.setAttribute('data-theme', t);
  localStorage.setItem('holdvue-theme', t);
}
document.getElementById('themeToggle').onclick=()=>{
  setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');
};

function setLowContrast(on){
  lowContrast=!!on;
  localStorage.setItem('holdvue-lowcontrast', lowContrast?'1':'0');
  root.classList.toggle('lowcontrast', lowContrast);
}

function marketKind(s){
  if(s && s.coingecko) return 'us'; // 虛擬貨幣跟美股配色
  const code=String((s&&s.yahoo)||'');
  if(/\.TW$|\.TWO$|\.TW$/i.test(code) || /^\^?TW/i.test(code) || code==='^TWII') return 'tw';
  return 'us';
}

function fmt(v,prefix){
  if(v==null||v===''||v==='--') return '--';
  const n=Number(String(v).replace(/,/g,'')); if(Number.isNaN(n)) return String(v);
  let t=n>=1000?n.toFixed(0):n>=100?n.toFixed(1):n.toFixed(2);
  return (prefix||'')+t;
}

function fmtPct(p){
  if(p==null||p===''||Number.isNaN(Number(p))) return {text:'--',cls:'flat'};
  const n=Number(p);
  const sign=n>0?'+':'';
  const text=sign+n.toFixed(2)+'%';
  const cls=n>0?'up':n<0?'down':'flat';
  return {text,cls};
}

function sessClass(session){
  if(session==='盤前') return 'pre';
  if(session==='盤中') return 'reg';
  if(session==='盤後') return 'post';
  if(session==='24h') return 'h24';
  if(session==='休市') return 'closed';
  return 'closed';
}

function quoteDetail(id){
  const d=(quotes.detail&&quotes.detail[id])||{};
  return {
    price: d.price!=null?d.price:quotes[id],
    changePercent: d.changePercent,
    session: d.session
  };
}

function applyLockUi(){
  const mini=document.getElementById('mini');
  mini.classList.toggle('is-locked', locked);
  document.getElementById('ctxStatus').textContent=locked?'系統監控':'極簡浮動視窗';
  document.querySelectorAll('#ctx [data-stock="1"]').forEach(el=>{
    el.style.display=locked?'none':'';
  });
}

/** 僅在切換模式／選單指定尺寸時調整，避免定時刷新把使用者拉大的視窗縮回去 */
function resizeForMode(force){
  if(!isWidget || root.classList.contains('fullmode')) return;
  if(!force && sizeFitDone) return;
  if(viewMode==='sys'){
    post({cmd:'resize', w:320, h:82});
  }else{
    const rows=Math.ceil(Math.max(1, cfg.symbols.length)/2);
    const h=Math.min(420, Math.max(120, 20 + rows*26));
    post({cmd:'resize', w:580, h:h});
  }
  sizeFitDone=true;
}

function renderMini(){
  const grid=document.getElementById('miniGrid');
  const mini=document.getElementById('mini');
  const mode=locked?'sys':viewMode;
  mini.dataset.mode=mode;
  root.setAttribute('data-view', mode);
  grid.innerHTML='';

  function cell(k,v,extraHtml,mkt){
    const d=document.createElement('div');
    d.className='mini-cell'+(mkt==='tw'?' mkt-tw':'');
    d.innerHTML=`<span class="k">${k}</span><span class="v">${v}</span>${extraHtml||''}`;
    grid.appendChild(d);
  }

  if(mode==='sys'){
    cell('上傳:', quotes.UP || quotes.up || '0.00 KB/s');
    cell('下載:', quotes.DOWN || quotes.down || '0.00 KB/s');
    cell('CPU:', (quotes.CPU ?? quotes.cpu ?? '--')+' %');
    cell('記憶體:', (quotes.RAM ?? quotes.ram ?? '--')+' %');
  }else{
    cfg.symbols.forEach(s=>{
      const q=quoteDetail(s.id);
      const pct=fmtPct(q.changePercent);
      const sess=q.session||'休市';
      const mkt=marketKind(s);
      const extra=`<span class="chg ${pct.cls}">${pct.text}</span><span class="sess ${sessClass(sess)}">${sess}</span>`;
      cell((s.label||s.id)+':', fmt(q.price, s.prefix||''), extra, mkt);
    });
  }
  applyLockUi();
}

function flashHint(text){
  const mini=document.getElementById('mini');
  const hint=document.getElementById('miniHint');
  hint.textContent=text;
  mini.classList.add('show-hint');
  clearTimeout(flashHint._t);
  flashHint._t=setTimeout(()=>mini.classList.remove('show-hint'), 1200);
}

function toggleView(){
  if(locked){
    flashHint('已鎖定');
    return;
  }
  viewMode=viewMode==='sys'?'stock':'sys';
  localStorage.setItem('holdvue-view', viewMode);
  sizeFitDone=false;
  renderMini();
  resizeForMode(true);
}

function setLocked(on){
  locked=!!on;
  localStorage.setItem('holdvue-lock', locked?'1':'0');
  if(locked){
    viewMode='sys';
    localStorage.setItem('holdvue-view', 'sys');
    flashHint('安全鎖定');
  }else{
    flashHint('已解鎖');
  }
  sizeFitDone=false;
  renderMini();
  resizeForMode(true);
}

function onMiniClick(){
  const now=Date.now();
  clickTimes=clickTimes.filter(t=>now-t<TRIPLE_MS);
  clickTimes.push(now);
  if(clickTimes.length>=3){
    clickTimes=[];
    setLocked(!locked);
    return;
  }
  // defer single-click toggle slightly so triple can cancel
  clearTimeout(onMiniClick._t);
  onMiniClick._t=setTimeout(()=>{
    if(clickTimes.length===1){
      clickTimes=[];
      toggleView();
    }
  }, TRIPLE_MS);
}

/* Drag vs click */
function bindDragRegion(el, opts){
  if(!el) return;
  const onClick=opts&&opts.onClick;
  let down=null, dragged=false;
  el.addEventListener('pointerdown', e=>{
    if(e.button!==0) return;
    if(e.target.closest && e.target.closest('button, a, input, select, textarea, label')) return;
    down={x:e.clientX, y:e.clientY};
    dragged=false;
    try{ el.setPointerCapture(e.pointerId); }catch{}
  });
  el.addEventListener('pointermove', e=>{
    if(!down && !dragged) return;
    if(down && !dragged){
      const dx=e.clientX-down.x, dy=e.clientY-down.y;
      if((dx*dx+dy*dy)>36){
        dragged=true;
        post({cmd:'drag'});
        down=null;
      }
      return;
    }
    if(dragged) post({cmd:'dragMove'});
  });
  el.addEventListener('pointerup', e=>{
    if(e.button!==0) return;
    try{ el.releasePointerCapture(e.pointerId); }catch{}
    if(dragged){
      post({cmd:'dragEnd'});
      dragged=false;
      down=null;
      return;
    }
    if(down && !dragged && onClick) onClick(e);
    down=null;
  });
  el.addEventListener('pointercancel', e=>{
    try{ el.releasePointerCapture(e.pointerId); }catch{}
    if(dragged) post({cmd:'dragEnd'});
    dragged=false;
    down=null;
  });
}

(function bindMiniInteract(){
  const mini=document.getElementById('mini');
  bindDragRegion(mini, { onClick: ()=>onMiniClick() });
  mini.addEventListener('contextmenu', e=>{
    e.preventDefault();
    e.stopPropagation();
    post({cmd:'menu', locked: locked ? 1 : 0});
  });
  // 完整設定頁：拖標題列區域
  bindDragRegion(document.querySelector('.full .hero'));

  // Electron：僅左下／右下角縮放（原生殼由系統游標處理）
  document.querySelectorAll('.resize-handle').forEach(handle=>{
    let active=false;
    handle.addEventListener('pointerdown', e=>{
      if(e.button!==0) return;
      e.preventDefault();
      e.stopPropagation();
      active=true;
      try{ handle.setPointerCapture(e.pointerId); }catch{}
      post({cmd:'resizeStart', edge: handle.dataset.edge});
    });
    handle.addEventListener('pointermove', ()=>{
      if(active) post({cmd:'resizeMove'});
    });
    handle.addEventListener('pointerup', e=>{
      if(!active) return;
      active=false;
      try{ handle.releasePointerCapture(e.pointerId); }catch{}
      post({cmd:'resizeEnd'});
    });
    handle.addEventListener('pointercancel', ()=>{
      if(!active) return;
      active=false;
      post({cmd:'resizeEnd'});
    });
  });
})();

window.holdvueMenu=function(act, val){
  if(act==='toggle') toggleView();
  else if(act==='theme') setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');
  else if(act==='size-sys'){ sizeFitDone=false; post({cmd:'resize', w:320, h:82}); sizeFitDone=true; }
  else if(act==='size-stock'){ if(!locked){ viewMode='stock'; localStorage.setItem('holdvue-view','stock'); } sizeFitDone=false; renderMini(); resizeForMode(true); }
  else if(act==='full') enterFullMode();
  else if(act==='reload') refreshQuotes();
  else if(act==='lowcontrast'){
    if(typeof val==='boolean') setLowContrast(val);
    else setLowContrast(!lowContrast);
    flashHint(lowContrast?'低對比：開':'低對比：關');
  }
};
window.holdvueSetLowContrast=function(on){ setLowContrast(!!on); };

function openCtx(x,y){
  const ctx=document.getElementById('ctx');
  applyLockUi();
  ctx.classList.add('open');
  const pad=6;
  const w=ctx.offsetWidth||180, h=ctx.offsetHeight||260;
  ctx.style.left=Math.min(x, window.innerWidth-w-pad)+'px';
  ctx.style.top=Math.min(y, window.innerHeight-h-pad)+'px';
}
function closeCtx(){ document.getElementById('ctx').classList.remove('open'); }
document.addEventListener('click', e=>{
  if(!e.target.closest('#ctx')) closeCtx();
});
document.getElementById('ctx').addEventListener('click', e=>{
  const btn=e.target.closest('button[data-act]');
  if(!btn) return;
  const act=btn.dataset.act;
  closeCtx();
  if(act==='toggle') toggleView();
  else if(act==='theme') setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');
  else if(act==='topmost') post({cmd:'topmost'});
  else if(act==='clickthrough') post({cmd:'clickthrough'});
  else if(act==='lowcontrast'){ setLowContrast(!lowContrast); flashHint(lowContrast?'低對比：開':'低對比：關'); }
  else if(act==='size-sys'){ sizeFitDone=false; post({cmd:'resize', w:320, h:82}); sizeFitDone=true; }
  else if(act==='size-stock'){ viewMode='stock'; if(!locked){ localStorage.setItem('holdvue-view','stock'); } sizeFitDone=false; renderMini(); resizeForMode(true); }
  else if(act==='full') enterFullMode();
  else if(act==='reload') refreshQuotes();
  else if(act==='hide') post({cmd:'hide'});
  else if(act==='exit') post({cmd:'exit'});
});

function enterFullMode(){
  root.classList.add('fullmode');
  post({cmd:'resize', w:420, h:640, chrome:true});
}
function exitFullMode(){
  root.classList.remove('fullmode');
  sizeFitDone=false;
  renderMini();
  resizeForMode(true);
  post({cmd:'chrome', on:false});
}

/* Full dashboard */
document.querySelectorAll('.full .tabs button').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.full .tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab=btn.dataset.tab;
    document.getElementById('tab-board').classList.toggle('hidden', tab!=='board');
    document.getElementById('tab-settings').classList.toggle('hidden', tab!=='settings');
  };
});

function toast(msg,ok){const el=document.getElementById('toast'); el.textContent=msg; el.className='toast '+(ok?'ok':'');}
function testToast(msg,ok){const el=document.getElementById('testResult'); el.textContent=msg; el.className='toast '+(ok?'ok':'bad');}

function renderBoard(){
  document.getElementById('cpu').textContent=(quotes.CPU??'--')+'%';
  document.getElementById('ram').textContent=(quotes.RAM??'--')+'%';
  document.getElementById('updatedFull').textContent='更新 '+(quotes.updated||'--');
  const board=document.getElementById('board'); board.innerHTML='';
  cfg.symbols.forEach(s=>{
    const tile=document.createElement('div'); tile.className='card'+(marketKind(s)==='tw'?' mkt-tw':'');
    const src=s.coingecko?'CoinGecko':'Yahoo';
    const code=s.coingecko||s.yahoo||'';
    const q=quoteDetail(s.id);
    const pct=fmtPct(q.changePercent);
    const sess=q.session||'休市';
    tile.innerHTML=`<div class="label">${s.label||s.id}</div><div class="price">${fmt(q.price, s.prefix||'')}</div><div class="meta"><span class="chg ${pct.cls}">${pct.text}</span><span class="sess ${sessClass(sess)}">${sess}</span></div><div class="label">${src} · ${code}</div>`;
    board.appendChild(tile);
  });
  renderMini();
}
function renderTable(){
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  cfg.symbols.forEach((s,i)=>{
    const tr=document.createElement('tr');
    tr.onclick=()=>{selected=i; renderTable();};
    if(i===selected) tr.style.background='rgba(10,132,255,.16)';
    const src=s.coingecko?'CoinGecko':'Yahoo';
    const code=s.coingecko||s.yahoo||'';
    tr.innerHTML=`<td><span class="ord"><span class="ord-btns"><button type="button" data-move="-1" title="上移" ${i===0?'disabled':''}>▲</button><button type="button" data-move="1" title="下移" ${i===cfg.symbols.length-1?'disabled':''}>▼</button></span><span>${i+1}</span></span></td><td>${s.label||''}</td><td>${src}</td><td>${code}</td><td><button class="btn-secondary" type="button" data-test="1">驗證</button></td>`;
    tr.querySelectorAll('[data-move]').forEach(btn=>{
      btn.onclick=e=>{e.stopPropagation(); moveAt(i, Number(btn.dataset.move));};
    });
    const msgTr=document.createElement('tr');
    msgTr.className='row-msg';
    msgTr.innerHTML=`<td colspan="5"><div class="row-toast" data-row-toast="${i}"></div></td>`;
    tr.querySelector('[data-test]').onclick=e=>{
      e.stopPropagation();
      testRow(i, msgTr);
    };
    tb.appendChild(tr);
    tb.appendChild(msgTr);
  });
}
function moveAt(i,dir){
  const j=i+dir;
  if(j<0||j>=cfg.symbols.length)return;
  const t=cfg.symbols[i]; cfg.symbols[i]=cfg.symbols[j]; cfg.symbols[j]=t;
  selected=j; renderTable();
}
function removeSelected(){if(selected<0)return; cfg.symbols.splice(selected,1); selected=-1; renderTable();}
function normalizeYahooSymbol(code){
  let c=String(code||'').trim();
  if(!c) return c;
  if(c.startsWith('^')) return c;
  if(c.includes('.')) return c;
  if(/^\d{4,6}[A-Za-z]?$/i.test(c)) return c.toUpperCase()+'.TW';
  return c;
}
function uid(){return 's'+Math.random().toString(36).slice(2,9);}
function readNew(){
  const label=document.getElementById('newLabel').value.trim();
  const source=document.getElementById('newSource').value;
  let code=document.getElementById('newCode').value.trim();
  const prefix=document.getElementById('newPrefix').value;
  if(!label||!code) throw new Error('請填名稱與代碼');
  const item={id:uid(), label}; if(prefix) item.prefix=prefix;
  if(source==='coingecko') item.coingecko=code;
  else item.yahoo=normalizeYahooSymbol(code);
  return item;
}
async function addSymbol(){
  try{
    const item=readNew();
    cfg.symbols.push(item);
    renderTable();
    toast('已加入，正在儲存並更新報價…',true);
    document.getElementById('newLabel').value='';
    document.getElementById('newCode').value='';
    await saveConfig();
  }catch(e){toast(e.message,false);}
}
async function testPayload(item){const res=await fetch('/api/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)}); const data=await res.json(); if(!data.ok) throw new Error(data.error||'驗證失敗'); return data;}
async function testNew(){try{const d=await testPayload(readNew()); testToast(`連線成功：${d.symbol} = ${d.price}`,true);}catch(e){testToast(e.message,false);}}
function rowToast(msgTr, msg, ok){
  if(!msgTr) return;
  msgTr.classList.add('show');
  const el=msgTr.querySelector('.row-toast');
  if(!el) return;
  el.textContent=msg;
  el.className='row-toast '+(ok?'ok':'bad');
}
async function testRow(i, msgTr){
  try{
    rowToast(msgTr, '驗證中…', true);
    const d=await testPayload(cfg.symbols[i]);
    rowToast(msgTr, `${cfg.symbols[i].label}: ${d.symbol} = ${d.price}`, true);
  }catch(e){
    rowToast(msgTr, e.message, false);
  }
}
async function saveConfig(){
  // 儲存前再正規化一次，修正舊資料缺 .TW
  cfg.symbols=(cfg.symbols||[]).map(s=>{
    if(s&&s.yahoo) s.yahoo=normalizeYahooSymbol(s.yahoo);
    return s;
  });
  const res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
  const data=await res.json(); if(!data.ok){toast(data.error||'儲存失敗',false);return;}
  toast(data.warn ? ('已儲存（報價更新有警告）') : '已儲存，報價已更新', true);
  // 以伺服器回寫後的設定為準，並拉最新報價
  await loadConfig();
  await refreshQuotes();
}
async function loadConfig(){
  cfg=await (await fetch('/api/config')).json();
  renderTable();
  renderMini();
}
async function refreshQuotes(){
  quotes=await (await fetch('/api/quotes')).json();
  renderBoard();
}
async function refreshAll(){
  await loadConfig();
  try{ await fetch('/api/refresh',{method:'POST'}); }catch{}
  await refreshQuotes();
}
refreshAll().then(()=>{
  if(isWidget && !locked && viewMode==='stock'){
    sizeFitDone=false;
    resizeForMode(true);
  }
});
setInterval(refreshQuotes,5000);
if(isWidget) post({cmd:'ready'});
</script>
