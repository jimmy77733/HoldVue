<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark" data-view="sys">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HoldVue</title>
<link rel="icon" href="/assets/holdvue.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root, html[data-theme="light"]{
  --bg:#e8f5ea; --bg2:#d9efdd; --text:#1a1a1a; --muted:#3d5a45;
  --line:#7cb88a; --card:#ffffffcc; --accent:#2f7d4a; --ok:#1f8f3a; --danger:#c62828;
  --fill:#ffffffaa; --shadow:0 6px 18px rgba(0,0,0,.12);
}
html[data-theme="dark"]{
  --bg:#1c1c1e; --bg2:#252528; --text:#f5f5f7; --muted:#a1a1a6;
  --line:#3a3a3c; --card:#2c2c2ecc; --accent:#0a84ff; --ok:#30d158; --danger:#ff453a;
  --fill:#3a3a3caa; --shadow:0 8px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box; scrollbar-width:none !important; -ms-overflow-style:none !important}
*::-webkit-scrollbar{display:none !important; width:0 !important; height:0 !important}
html,body{height:100%; margin:0; overflow:hidden; background:transparent; color:var(--text);
  font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; user-select:none}
.hidden{display:none !important}

/* ===== Minimal float (TrafficMonitor style) ===== */
.mini{
  height:100%; width:100%;
  display:flex; flex-direction:column;
  border:1.5px solid var(--line);
  border-radius:10px;
  background:linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  box-shadow:var(--shadow);
  overflow:hidden;
  cursor:default;
}
.mini-grid{
  flex:1;
  display:grid;
  grid-template-columns:max-content max-content;
  column-gap:8px;
  row-gap:2px;
  padding:8px 10px;
  align-content:center;
  align-self:start;
  width:max-content;
  justify-content:start;
}
.mini-cell{
  display:flex; align-items:baseline; gap:4px;
  padding:2px 0;
  font-size:12.5px; line-height:1.3; white-space:nowrap;
  overflow:visible; width:max-content;
}
.mini-cell .k{color:var(--muted); font-weight:500; flex:0 0 auto}
.mini-cell .v{font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  overflow:visible}
.mini-cell .chg{font-weight:600; font-variant-numeric:tabular-nums; font-size:11px;
  letter-spacing:-.02em; flex:0 0 auto}
.mini-cell .chg.up{color:var(--ok)}
.mini-cell .chg.down{color:var(--danger)}
.mini-cell .chg.flat{color:var(--muted)}
/* 台股：紅漲綠跌；美股／加密：綠漲紅跌（預設） */
.mini-cell.mkt-tw .chg.up{color:var(--danger)}
.mini-cell.mkt-tw .chg.down{color:var(--ok)}
html.lowcontrast .mini-cell .chg.up,
html.lowcontrast .mini-cell .chg.down,
html.lowcontrast .mini-cell.mkt-tw .chg.up,
html.lowcontrast .mini-cell.mkt-tw .chg.down{color:var(--muted)}
.mini-cell .sess{
  flex:0 0 auto; font-size:10px; font-weight:600; line-height:1;
  padding:2px 5px; border-radius:4px; border:1px solid var(--line);
  color:var(--muted); background:var(--fill); letter-spacing:.02em;
}
.mini-cell .sess.pre{color:#f5a623; border-color:rgba(245,166,35,.45); background:rgba(245,166,35,.12)}
.mini-cell .sess.reg{color:var(--ok); border-color:rgba(48,209,88,.4); background:rgba(48,209,88,.12)}
.mini-cell .sess.post{color:var(--accent); border-color:rgba(10,132,255,.4); background:rgba(10,132,255,.12)}
.mini-cell .sess.closed{color:var(--muted)}
.mini-cell .sess.h24{color:var(--muted)}
html.lowcontrast .mini-cell .sess,
html.lowcontrast .mini-cell .sess.pre,
html.lowcontrast .mini-cell .sess.reg,
html.lowcontrast .mini-cell .sess.post,
html.lowcontrast .mini-cell .sess.closed,
html.lowcontrast .mini-cell .sess.h24{
  color:var(--muted); border-color:var(--line); background:var(--fill);
}
.mini[data-mode="sys"] .mini-grid{
  flex:0 0 auto;
  align-self:start;
  width:max-content;
  max-width:none;
  height:auto;
  max-height:none;
  overflow:visible;
  grid-template-columns:max-content max-content;
  column-gap:8px;
  row-gap:1px;
  padding:4px 10px;
  justify-content:start;
  align-content:start;
}
.mini[data-mode="sys"] .mini-cell{
  width:max-content;
  justify-content:flex-start;
  padding:0;
  line-height:1.25;
}
.mini[data-mode="stock"] .mini-grid{
  /* 高度貼齊內容；視窗較矮時才內部滾輪 */
  flex:0 1 auto;
  align-self:stretch;
  min-height:0;
  max-height:100%;
  width:max-content;
  max-width:100%;
  box-sizing:border-box;
  grid-template-columns:max-content;
  justify-content:start;
  justify-items:start;
  align-content:start;
  overflow-x:hidden;
  overflow-y:auto;
  padding:6px 8px;
  column-gap:10px;
  row-gap:3px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.mini[data-mode="stock"]{
  justify-content:flex-start;
}
.mini[data-mode="stock"] .mini-tabs{
  width:100%;
  align-self:stretch;
}
.mini[data-mode="stock"] .mini-grid::-webkit-scrollbar{
  width:0 !important;
  height:0 !important;
  display:none !important;
}
.mini[data-mode="stock"] .mini-cell{
  font-size:12px;
  padding:2px 0;
  gap:4px;
  width:max-content;
  box-sizing:border-box;
  justify-content:flex-start;
}
.mini[data-mode="stock"].cols-2 .mini-grid{
  grid-template-columns:max-content max-content;
}
.mini-lock{
  position:absolute; top:4px; right:6px; width:7px; height:7px; border-radius:50%;
  background:var(--ok); opacity:0; transition:opacity .2s;
  pointer-events:none;
}
.mini.is-locked .mini-lock{opacity:.85; background:#f5a623}
.mini-hint{
  position:absolute; left:0; right:0; bottom:2px; text-align:center;
  font-size:9px; color:var(--muted); opacity:0; pointer-events:none;
  transition:opacity .25s;
}
.mini.show-hint .mini-hint{opacity:.8}
.mini-tabs{
  display:none;
  flex:0 0 auto;
  gap:0;
  border-top:1px solid var(--line);
  background:rgba(0,0,0,.04);
  padding:0;
  min-height:22px;
}
html[data-theme="dark"] .mini-tabs{background:rgba(255,255,255,.04)}
.mini[data-mode="stock"] .mini-tabs{display:flex}
.mini-tabs button{
  flex:1; border:0; background:transparent; color:var(--muted);
  font:inherit; font-size:10px; font-weight:600; letter-spacing:.02em;
  padding:4px 2px; cursor:pointer; line-height:1.2;
  border-right:1px solid var(--line);
}
.mini-tabs button:last-child{border-right:0}
.mini-tabs button.active{color:var(--text); background:var(--fill)}
.mini-tabs button:hover{color:var(--text)}

/* Context menu */
.ctx{
  position:fixed; z-index:100; min-width:168px;
  background:var(--bg); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:4px; display:none;
}
.ctx.open{display:block}
.ctx button{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  color:var(--text); font:inherit; font-size:12.5px; padding:8px 10px;
  border-radius:7px; cursor:pointer;
}
.ctx button:hover{background:var(--fill)}
.ctx .sep{height:1px; background:var(--line); margin:4px 6px}
.ctx .dim{color:var(--muted); font-size:11px; padding:4px 10px 6px}

/* Full dashboard (settings / expanded) */
.full{
  height:100%; overflow:auto; background:var(--bg);
  padding:14px 14px 60px; color:var(--text);
}
.full .hero{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
html.widget.fullmode .full .hero{
  cursor:grab;
  user-select:none;
  padding:4px 2px 8px;
  margin:-4px -2px 12px;
  border-radius:8px;
}
html.widget.fullmode .full .hero:active{cursor:grabbing}
.full .brand{display:flex; gap:10px; align-items:center}
.full .brand img{width:36px; height:36px; border-radius:10px}
.full h1{margin:0; font-size:1.25rem; letter-spacing:-.03em}
.full .tabs{display:inline-flex; padding:3px; border-radius:980px; background:var(--fill); margin-bottom:12px}
.full .tabs button{border:0; background:transparent; color:var(--muted); font:inherit; font-size:.82rem;
  padding:6px 12px; border-radius:980px; cursor:pointer}
.full .tabs button.active{background:var(--card); color:var(--text)}
.board{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px}
.board-group{margin-bottom:14px}
.board-group:last-child{margin-bottom:0}
.board-group h3{
  margin:0 0 8px; font-size:.78rem; font-weight:600; color:var(--muted);
  letter-spacing:.04em; text-transform:none;
}
.settings .cat-panel{margin:10px 0 14px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--fill)}
.settings .cat-panel h3{margin:0 0 8px; font-size:.85rem}
.settings .cat-row{display:flex; gap:6px; align-items:center; margin-top:6px}
.settings .cat-row input{flex:1; min-width:80px}
.settings .section-title{margin:12px 0 4px; font-size:.85rem}
.settings select.cat-select{min-width:72px; flex:0 0 auto}
.settings tr.cat-head td{
  padding:10px 6px 6px; font-size:.78rem; font-weight:700; color:var(--muted);
  border-bottom:1px solid var(--line); background:transparent; letter-spacing:.04em;
}
.settings .autofill-hint{margin-top:6px; font-size:.75rem; color:var(--muted); min-height:1.1em}
.settings .autofill-hint.hit{color:var(--ok)}
.disp-grid{display:flex; flex-direction:column; gap:10px; margin-top:8px}
.disp-item{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--fill);
}
.disp-label{font-size:.85rem; font-weight:600; color:var(--text)}
.disp-actions{display:flex; flex-wrap:wrap; gap:6px}
.disp-switch{font-size:.82rem; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer}
.disp-item select{min-width:96px; border:1px solid var(--line); background:var(--bg);
  color:var(--text); border-radius:8px; padding:7px 9px; font:inherit; font-size:.8rem}
.disp-actions button.active{background:var(--accent); color:#fff; border-color:var(--accent)}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px}
.card .label{color:var(--muted); font-size:.75rem}
.card .price{margin-top:6px; font-size:1.25rem; font-weight:600; font-variant-numeric:tabular-nums}
.card .meta{margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.card .chg{font-size:.8rem; font-weight:600; font-variant-numeric:tabular-nums}
.card .chg.up{color:var(--ok)} .card .chg.down{color:var(--danger)} .card .chg.flat{color:var(--muted)}
.card.mkt-tw .chg.up{color:var(--danger)} .card.mkt-tw .chg.down{color:var(--ok)}
html.lowcontrast .card .chg.up,
html.lowcontrast .card .chg.down,
html.lowcontrast .card.mkt-tw .chg.up,
html.lowcontrast .card.mkt-tw .chg.down{color:var(--muted)}
.card .sess{
  font-size:.68rem; font-weight:600; padding:2px 6px; border-radius:4px;
  border:1px solid var(--line); color:var(--muted); background:var(--fill);
}
.card .sess.pre{color:#f5a623; border-color:rgba(245,166,35,.45); background:rgba(245,166,35,.12)}
.card .sess.reg{color:var(--ok); border-color:rgba(48,209,88,.4); background:rgba(48,209,88,.12)}
.card .sess.post{color:var(--accent); border-color:rgba(10,132,255,.4); background:rgba(10,132,255,.12)}
.card .sess.closed,.card .sess.h24{color:var(--muted)}
html.lowcontrast .card .sess,
html.lowcontrast .card .sess.pre,
html.lowcontrast .card .sess.reg,
html.lowcontrast .card .sess.post,
html.lowcontrast .card .sess.closed,
html.lowcontrast .card .sess.h24{
  color:var(--muted); border-color:var(--line); background:var(--fill);
}
.sys{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px}
.settings .toolbar{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.settings .ord{display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
.settings .ord-btns{display:inline-flex; flex-direction:column; gap:1px}
.settings .ord-btns button{
  border:0; background:var(--fill); color:var(--muted); cursor:pointer;
  width:18px; height:14px; padding:0; border-radius:4px; font-size:9px; line-height:1;
}
.settings .ord-btns button:hover{color:var(--text); background:var(--card)}
.settings .ord-btns button:disabled{opacity:.35; cursor:default}
.settings button{border:0; border-radius:980px; padding:7px 12px; font:inherit; font-size:.8rem; cursor:pointer}
.btn-primary{background:var(--accent); color:#fff}
.btn-secondary{background:var(--fill); color:var(--text)}
.btn-danger{background:rgba(255,59,48,.12); color:var(--danger)}
.settings table{width:100%; border-collapse:collapse}
.settings th,.settings td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:.8rem}
.settings .row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px}
.settings input,.settings select{flex:1; min-width:90px; border:1px solid var(--line); background:var(--bg);
  color:var(--text); border-radius:8px; padding:7px 9px; font:inherit; font-size:.8rem}
.toast{min-height:1.1em; margin-top:8px; color:var(--muted); font-size:.8rem}
.ok{color:var(--ok)} .bad{color:var(--danger)}
.settings tr.row-msg td{padding:0 6px 8px; border-bottom:1px solid var(--line); font-size:.78rem}
.settings tr.row-msg .row-toast{min-height:0; padding:2px 4px 0; color:var(--muted)}
.settings tr.row-msg .row-toast.ok{color:var(--ok)}
.settings tr.row-msg .row-toast.bad{color:var(--danger)}
.settings tr.row-msg:not(.show){display:none}
.theme-toggle{
  position:fixed; right:12px; bottom:12px; z-index:40; width:36px; height:36px; border-radius:50%;
  border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer;
  display:grid; place-items:center;
}
html[data-theme="light"] .icon-moon{display:none}
html[data-theme="dark"] .icon-sun{display:none}
/* 極簡浮動視窗：隱藏主題鈕，避免擋住網速／記憶體文字（改用右鍵切換） */
html.widget:not(.fullmode) .theme-toggle{display:none !important}
html:not(.widget) .mini{display:none}
html.widget .full{display:none}
html.widget.fullmode .mini{display:none}
html.widget.fullmode .full{display:block}
/* 左下／右下角＋底邊可調尺寸 */
.resize-handle{
  position:fixed; z-index:60; opacity:0;
}
.resize-handle.se,.resize-handle.sw{
  width:16px; height:16px; bottom:0;
}
.resize-handle.se{right:0; cursor:nwse-resize}
.resize-handle.sw{left:0; cursor:nesw-resize}
.resize-handle.s{
  left:16px; right:16px; bottom:0; height:8px;
  cursor:ns-resize;
}
html:not(.widget) .resize-handle{display:none !important}
</style>
</head>
<body>
  <!-- Minimal float -->
  <div class="mini" id="mini" data-mode="sys">
    <span class="mini-lock" title="已鎖定"></span>
    <div class="mini-grid" id="miniGrid"></div>
    <div class="mini-tabs" id="miniTabs"></div>
    <div class="mini-hint" id="miniHint"></div>
  </div>

  <!-- Full UI -->
  <div class="full" id="full">
    <header class="hero">
      <div class="brand">
        <img src="/assets/holdvue.png" alt=""/>
        <div><h1>HoldVue</h1></div>
      </div>
      <div id="updatedFull" style="font-size:.75rem;color:var(--muted)">同步中</div>
    </header>
    <nav class="tabs">
      <button class="active" type="button" data-tab="board">觀測看板</button>
      <button type="button" data-tab="settings">標的設定</button>
      <button type="button" data-tab="display">顯示設定</button>
    </nav>
    <section id="tab-board">
      <div class="sys">
        <div class="card"><div class="label">CPU</div><div class="price" id="cpu">--%</div></div>
        <div class="card"><div class="label">記憶體</div><div class="price" id="ram">--%</div></div>
      </div>
      <div id="boardWrap"></div>
    </section>
    <section id="tab-settings" class="settings hidden">
      <div class="card">
        <div class="toolbar">
          <button class="btn-danger" type="button" onclick="removeSelected()">刪除</button>
          <button class="btn-primary" type="button" onclick="saveConfig()">儲存設定</button>
          <button class="btn-secondary" type="button" onclick="refreshAll()">重新整理</button>
          <button class="btn-secondary" type="button" onclick="exitFullMode()">返回極簡</button>
        </div>
        <div class="section-title"><strong>新增標的</strong></div>
        <div class="row">
          <label>名稱</label><input id="newLabel" placeholder="0050" autocomplete="off"/>
          <label>來源</label>
          <select id="newSource"><option value="yahoo">Yahoo</option><option value="coingecko">CoinGecko</option></select>
          <label>分類</label>
          <select id="newCategory" class="cat-select"></select>
        </div>
        <div class="row">
          <label>代碼</label><input id="newCode" placeholder="0050.TW" autocomplete="off"/>
          <label>前綴</label><input id="newPrefix" placeholder="$" style="max-width:64px"/>
          <button class="btn-primary" type="button" onclick="addSymbol()">加入</button>
          <button class="btn-secondary" type="button" onclick="testNew()">驗證</button>
        </div>
        <div class="autofill-hint" id="autofillHint">輸入名稱或代碼後稍候，會自動帶入對應欄位</div>
        <div class="toast" id="toast"></div>
        <div class="toast" id="testResult"></div>

        <div class="cat-panel">
          <h3>分類分頁（股票模式底部 TAB）</h3>
          <div id="catList"></div>
          <div class="cat-row">
            <input id="newCatName" placeholder="新分類名稱，例如 TW"/>
            <button class="btn-primary" type="button" onclick="addCategory()">新增分類</button>
          </div>
        </div>

        <div class="section-title"><strong>標的列表</strong></div>
        <table><thead><tr><th>#</th><th>名稱</th><th>分類</th><th>來源</th><th>代碼</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
      </div>
    </section>
    <section id="tab-display" class="settings hidden">
      <div class="card">
        <div class="toolbar">
          <button class="btn-secondary" type="button" onclick="exitFullMode()">返回極簡</button>
        </div>
        <div class="section-title"><strong>極簡模式顯示</strong></div>
        <div class="disp-grid">
          <div class="disp-item">
            <span class="disp-label">預設顯示</span>
            <div class="disp-actions">
              <button type="button" class="btn-secondary" id="dispModeSys" onclick="applyDisplayMode('sys')">系統列</button>
              <button type="button" class="btn-secondary" id="dispModeStock" onclick="applyDisplayMode('stock')">股票列</button>
            </div>
          </div>
          <div class="disp-item">
            <span class="disp-label">主題</span>
            <div class="disp-actions">
              <button type="button" class="btn-secondary" id="dispThemeLight" onclick="setTheme('light'); syncDisplayUi();">淺色</button>
              <button type="button" class="btn-secondary" id="dispThemeDark" onclick="setTheme('dark'); syncDisplayUi();">深色</button>
            </div>
          </div>
          <div class="disp-item">
            <span class="disp-label">永遠置頂</span>
            <label class="disp-switch"><input type="checkbox" id="dispTopmost" onchange="setTopmost(this.checked)"/> 啟用</label>
          </div>
          <div class="disp-item">
            <span class="disp-label">左鍵穿透</span>
            <label class="disp-switch"><input type="checkbox" id="dispClickThrough" onchange="setClickThrough(this.checked)"/> 啟用</label>
          </div>
          <div class="disp-item">
            <span class="disp-label">低對比</span>
            <label class="disp-switch"><input type="checkbox" id="dispLowContrast" onchange="setLowContrast(this.checked); syncDisplayUi();"/> 啟用</label>
          </div>
          <div class="disp-item">
            <span class="disp-label">透明度</span>
            <select id="dispOpacity" onchange="setOpacityPct(Number(this.value))">
              <option value="100">100%</option>
              <option value="90">90%</option>
              <option value="80">80%</option>
              <option value="70">70%</option>
              <option value="60">60%</option>
              <option value="50">50%</option>
              <option value="40">40%</option>
            </select>
          </div>
          <div class="disp-item">
            <span class="disp-label">尺寸重設</span>
            <div class="disp-actions">
              <button type="button" class="btn-secondary" onclick="holdvueMenu('size-sys')">系統列最佳尺寸</button>
              <button type="button" class="btn-secondary" onclick="holdvueMenu('size-stock')">股票列最佳尺寸</button>
            </div>
          </div>
        </div>
        <div class="toast" id="dispToast"></div>
      </div>
    </section>
  </div>

  <div class="ctx" id="ctx">

    <button type="button" data-act="theme">切換深淺色</button>

  <button class="theme-toggle" type="button" id="themeToggle" title="主題">
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
  </button>
  <div class="resize-handle sw" data-edge="sw" title="調整大小"></div>
  <div class="resize-handle s" data-edge="s" title="調整高度"></div>
  <div class="resize-handle se" data-edge="se" title="調整大小"></div>

<script>
const root=document.documentElement;
const params=new URLSearchParams(location.search);
const isWidget=params.has('widget');
if(isWidget) root.classList.add('widget');

const savedTheme=localStorage.getItem('holdvue-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
root.setAttribute('data-theme', savedTheme);

let cfg={symbols:[], categories:['TW','US','Coin']};
let quotes={};
let selected=-1;
let viewMode=localStorage.getItem('holdvue-view') || 'sys'; // sys | stock
let stockTab=localStorage.getItem('holdvue-stock-tab') || '';
let locked=localStorage.getItem('holdvue-lock')==='1';
let lowContrast=localStorage.getItem('holdvue-lowcontrast')==='1';
let clickTimes=[];
let sizeFitDone=false;
const TRIPLE_MS=650;
const DEFAULT_CATEGORIES=['TW','US','Coin'];
/** 系統／股票各自記住視窗尺寸，互不覆蓋 */
let modeSizes=(()=>{
  try{ return JSON.parse(localStorage.getItem('holdvue-mode-sizes')||'{}')||{}; }
  catch{ return {}; }
})();
// 清掉偏高的系統／股票尺寸，改回貼齊內容
if(modeSizes.sys && modeSizes.sys.h>72) delete modeSizes.sys;
if(modeSizes.stock && modeSizes.stock.h>420) delete modeSizes.stock;
if(lowContrast) root.classList.add('lowcontrast');

function currentMode(){ return locked?'sys':viewMode; }

function inferCategory(s, cats){
  const list=cats&&cats.length?cats:DEFAULT_CATEGORIES;
  const prefer=s&&s.coingecko?'Coin':(marketKind(s)==='tw'?'TW':'US');
  if(list.includes(prefer)) return prefer;
  return list[0];
}

function ensureCategories(data){
  const next=data&&typeof data==='object'?data:{symbols:[]};
  if(!Array.isArray(next.categories) || !next.categories.length){
    next.categories=DEFAULT_CATEGORIES.slice();
  }else{
    next.categories=next.categories.map(c=>String(c||'').trim()).filter(Boolean);
    if(!next.categories.length) next.categories=DEFAULT_CATEGORIES.slice();
  }
  // 去重並保留順序
  const seen=new Set();
  next.categories=next.categories.filter(c=>{
    if(seen.has(c)) return false;
    seen.add(c); return true;
  });
  next.symbols=(next.symbols||[]).map(s=>{
    if(!s || typeof s!=='object') return s;
    if(!s.category || !next.categories.includes(s.category)){
      s.category=inferCategory(s, next.categories);
    }
    return s;
  });
  return next;
}

function categories(){
  return (cfg.categories&&cfg.categories.length)?cfg.categories:DEFAULT_CATEGORIES.slice();
}

function activeStockTab(){
  const cats=categories();
  if(stockTab && cats.includes(stockTab)) return stockTab;
  return cats[0]||'TW';
}

function setStockTab(name){
  const cats=categories();
  if(!cats.includes(name)) return;
  stockTab=name;
  localStorage.setItem('holdvue-stock-tab', stockTab);
  sizeFitDone=false;
  delete modeSizes.stock;
  renderMini();
  if(isWidget && !root.classList.contains('fullmode') && currentMode()==='stock'){
    resizeForMode(true);
  }
}

function symbolsInCategory(cat){
  const c=cat||activeStockTab();
  return (cfg.symbols||[]).filter(s=>s.category===c);
}

function symbolsGrouped(){
  const cats=categories();
  const groups=cats.map(cat=>({cat, items:symbolsInCategory(cat)}));
  const known=new Set(cats);
  const orphan=(cfg.symbols||[]).filter(s=>!known.has(s.category));
  if(orphan.length) groups.push({cat:'其他', items:orphan});
  return groups;
}

function persistModeSize(mode, w, h){
  if(!mode||!(w>0)||!(h>0)) return;
  modeSizes[mode]={w:Math.round(w), h:Math.round(h)};
  try{ localStorage.setItem('holdvue-mode-sizes', JSON.stringify(modeSizes)); }catch{}
}

function rememberCurrentWindow(mode){
  const m=mode||currentMode();
  persistModeSize(m, window.innerWidth, window.innerHeight);
}

function post(msg){
  try{
    if(window.holdvueDesktop){
      const m=typeof msg==='string'?{cmd:msg}:msg;
      if(m.cmd==='menu') return holdvueDesktop.menu(!!m.locked);
      if(m.cmd==='drag') return holdvueDesktop.drag();
      if(m.cmd==='dragMove') return holdvueDesktop.dragMove && holdvueDesktop.dragMove();
      if(m.cmd==='dragEnd') return holdvueDesktop.dragEnd && holdvueDesktop.dragEnd();
      if(m.cmd==='resizeStart') return holdvueDesktop.resizeStart && holdvueDesktop.resizeStart(m.edge);
      if(m.cmd==='resizeMove') return holdvueDesktop.resizeMove && holdvueDesktop.resizeMove();
      if(m.cmd==='resizeEnd') return holdvueDesktop.resizeEnd && holdvueDesktop.resizeEnd();
      if(m.cmd==='resize') return holdvueDesktop.resize(m.w, m.h, !!m.chrome);
      if(m.cmd==='chrome') return holdvueDesktop.chrome(!!m.on);
      if(m.cmd==='hide') return holdvueDesktop.hide();
      if(m.cmd==='topmost') return holdvueDesktop.topmost && holdvueDesktop.topmost(m.on);
      if(m.cmd==='clickthrough') return holdvueDesktop.clickThrough && holdvueDesktop.clickThrough(m.on);
      if(m.cmd==='opacity') return holdvueDesktop.opacity && holdvueDesktop.opacity(m.pct);
      if(m.cmd==='prefs') return holdvueDesktop.getPrefs && holdvueDesktop.getPrefs().then(p=>holdvuePrefs(p));
      if(m.cmd==='exit') return;
    }
    if(window.chrome && chrome.webview && chrome.webview.postMessage)
      chrome.webview.postMessage(typeof msg==='string'?msg:JSON.stringify(msg));
  }catch{}
}

function setTheme(t){
  root.setAttribute('data-theme', t);
  localStorage.setItem('holdvue-theme', t);
}
document.getElementById('themeToggle').onclick=()=>{
  setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');
};

function setLowContrast(on){
  lowContrast=!!on;
  localStorage.setItem('holdvue-lowcontrast', lowContrast?'1':'0');
  root.classList.toggle('lowcontrast', lowContrast);
}

function marketKind(s){
  if(s && s.coingecko) return 'us'; // 虛擬貨幣跟美股配色
  const code=String((s&&s.yahoo)||'');
  if(/\.TW$|\.TWO$|\.TW$/i.test(code) || /^\^?TW/i.test(code) || code==='^TWII') return 'tw';
  return 'us';
}

function fmt(v,prefix){
  if(v==null||v===''||v==='--') return '--';
  const n=Number(String(v).replace(/,/g,'')); if(Number.isNaN(n)) return String(v);
  let t=n>=1000?n.toFixed(0):n>=100?n.toFixed(1):n.toFixed(2);
  return (prefix||'')+t;
}

function fmtPct(p){
  if(p==null||p===''||Number.isNaN(Number(p))) return {text:'--',cls:'flat'};
  const n=Number(p);
  const sign=n>0?'+':'';
  const text=sign+n.toFixed(2)+'%';
  const cls=n>0?'up':n<0?'down':'flat';
  return {text,cls};
}

function sessClass(session){
  if(session==='盤前') return 'pre';
  if(session==='盤中') return 'reg';
  if(session==='盤後') return 'post';
  if(session==='24h') return 'h24';
  if(session==='休市') return 'closed';
  return 'closed';
}

function quoteDetail(id){
  const d=(quotes.detail&&quotes.detail[id])||{};
  return {
    price: d.price!=null?d.price:quotes[id],
    changePercent: d.changePercent,
    session: d.session
  };
}

function applyLockUi(){
  const mini=document.getElementById('mini');
  mini.classList.toggle('is-locked', locked);
  document.getElementById('ctxStatus').textContent=locked?'系統監控':'極簡浮動視窗';
  document.querySelectorAll('#ctx [data-stock="1"]').forEach(el=>{
    el.style.display=locked?'none':'';
  });
}

/** 量測單一列的自然寬（加總子元素，避免被父層裁切時 scrollWidth 失真） */
function cellNaturalWidth(cell){
  const cs=getComputedStyle(cell);
  const gap=parseFloat(cs.gap)||0;
  const pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const kids=[...cell.children];
  if(!kids.length) return Math.ceil(cell.scrollWidth||0);
  let w=pad;
  kids.forEach((kid,i)=>{
    w+=Math.ceil(kid.getBoundingClientRect().width||kid.scrollWidth||0);
    if(i<kids.length-1) w+=gap;
  });
  return Math.max(Math.ceil(w), Math.ceil(cell.scrollWidth||0));
}

/**
 * 以儲存格自然寬高加總。
 * @param {number} cols 明確欄數
 * @param {{tight?:boolean}} [opts] tight：系統模式用，高度少留餘裕
 */
function measureMiniGridSize(cols, opts){
  const grid=document.getElementById('miniGrid');
  const cells=[...grid.querySelectorAll('.mini-cell')];
  if(!cells.length) return {w:140, h:52};
  cols=Math.max(1, cols|0);
  const tight=!!(opts&&opts.tight);
  const cs=getComputedStyle(grid);
  const padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
  const colGap=parseFloat(cs.columnGap)||0;
  const rowGap=parseFloat(cs.rowGap)||0;
  const colW=Array(cols).fill(0);
  const rowH=[];
  cells.forEach((cell, i)=>{
    const col=i%cols;
    const row=Math.floor(i/cols);
    colW[col]=Math.max(colW[col], cellNaturalWidth(cell));
    rowH[row]=Math.max(rowH[row]||0, Math.ceil(cell.getBoundingClientRect().height||cell.offsetHeight||16));
  });
  const contentW=colW.reduce((a,b)=>a+b,0)+colGap*Math.max(0, cols-1);
  const contentH=rowH.reduce((a,b)=>a+b,0)+rowGap*Math.max(0, rowH.length-1);
  const border=3; // 1.5px * 2
  const widthPad=tight?8:10;
  // 高度：緊貼內容 + border；系統模式不再多加垂直餘裕
  const heightPad=tight?0:4;
  return {
    w:Math.max(120, Math.ceil(padX+contentW+border+widthPad)),
    h:Math.max(tight?40:52, Math.ceil(padY+contentH+border+heightPad))
  };
}

/** 縮放後若仍裁切則補寬／貼齊高度 */
function ensureMiniNoClip(baseW, baseH){
  const mode=currentMode();
  if(mode==='stock'){
    const fit=fitStockWindowSize(document.getElementById('mini').classList.contains('cols-2'));
    const w=Math.max(baseW, fit.w);
    const h=fit.h; // 股票模式一律貼齊內容，避免列表與 TAB 間大片空白
    if(Math.abs(w-baseW)>1 || Math.abs(h-baseH)>1){
      post({cmd:'resize', w, h});
      persistModeSize('stock', w, h);
    }
    return;
  }
  const cols=2;
  const need=measureMiniGridSize(cols, {tight:true});
  if(need.w>baseW+1 || Math.abs(need.h-baseH)>1){
    post({cmd:'resize', w:Math.max(baseW, need.w), h:need.h});
    persistModeSize('sys', Math.max(baseW, need.w), need.h);
  }
}

/** 股票模式：寬高皆依目前分類內容貼齊（TAB 寬度跟隨內容寬，不回讀視窗寬） */
function fitStockWindowSize(preferTwo){
  const mini=document.getElementById('mini');
  const n=Math.max(1, symbolsInCategory().length);
  const useTwo=preferTwo!==false && n>=2;
  mini.classList.toggle('cols-2', useTwo);
  void mini.offsetWidth;
  const {w,h}=measureMiniGridSize(useTwo?2:1, {tight:true});
  const tabs=document.getElementById('miniTabs');
  let tabsH=22;
  if(tabs && getComputedStyle(tabs).display!=='none'){
    tabsH=Math.max(22, Math.ceil(tabs.getBoundingClientRect().height||22));
  }
  // 寬度只看標的列，避免 TAB flex 被大視窗撐開後污染量測
  return {w:Math.max(w, 132), h:Math.min(420, Math.max(64, h+tabsH)), useTwo};
}

/** 系統監控：永遠貼齊內容，不受股票模式高寬影響 */
function fitSysWindowSize(){
  const mini=document.getElementById('mini');
  const grid=document.getElementById('miniGrid');
  mini.classList.remove('cols-2');
  mini.dataset.mode='sys';
  void mini.offsetWidth;
  const measured=measureMiniGridSize(2, {tight:true});
  const laid=Math.ceil(grid.getBoundingClientRect().height)+3;
  return {w:measured.w, h:Math.max(40, Math.min(measured.h, laid))};
}

/** 僅手動拉寬／縮小時切換單／雙欄 */
function syncStockColsToWidth(snap){
  if(!isWidget || root.classList.contains('fullmode')) return;
  if(currentMode()!=='stock') return;
  const mini=document.getElementById('mini');
  const n=symbolsInCategory().length;
  if(n<2){ mini.classList.remove('cols-2'); return; }
  const wasTwo=mini.classList.contains('cols-2');
  const twoSize=(()=>{ mini.classList.add('cols-2'); void mini.offsetWidth; return measureMiniGridSize(2, {tight:true}); })();
  const keep=window.innerWidth>=(wasTwo?twoSize.w-8:twoSize.w);
  mini.classList.toggle('cols-2', keep);
  if(snap){
    // 欄數變更後重新貼齊內容（含高度）
    const fit=fitStockWindowSize(keep);
    post({cmd:'resize', w:fit.w, h:fit.h});
    persistModeSize('stock', fit.w, fit.h);
  }
}

/**
 * 套用目前模式自己的視窗尺寸（與另一模式隔離）。
 * @param {boolean} force 強制依內容重新量測（寬高都貼齊）
 */
function resizeForMode(force){
  if(!isWidget || root.classList.contains('fullmode')) return;
  if(!force && sizeFitDone) return;
  const mode=currentMode();
  const apply=()=>{
    let w, h;
    const saved=modeSizes[mode];
    if(mode==='stock'){
      const mini=document.getElementById('mini');
      mini.classList.remove('cols-2');
      void mini.offsetWidth;
      const oneW=measureMiniGridSize(1, {tight:true}).w;
      // 僅在非強制、且先前寬度明顯夠雙欄時維持雙欄
      const preferTwo=!force && !!(saved && saved.w>=oneW*2-24 && symbolsInCategory().length>=2);
      const fit=fitStockWindowSize(preferTwo);
      w=fit.w;
      // force：寬高都貼齊內容；否則寬度仍貼齊，高度可保留手動放大（但不小於內容）
      if(force){
        h=fit.h;
      }else if(saved && saved.h>=fit.h && saved.h<=fit.h+48){
        // 接近內容的微調高度可保留
        h=saved.h;
      }else if(saved && saved.h>fit.h+48){
        // 明顯過高的舊尺寸（例如完整介面殘留）一律收回
        h=fit.h;
      }else{
        h=fit.h;
      }
      persistModeSize('stock', w, h);
    }else if(!force && saved && saved.w>=120 && saved.h>=40 && saved.h<=72){
      fitSysWindowSize();
      w=saved.w; h=saved.h;
    }else{
      ({w,h}=fitSysWindowSize());
      persistModeSize('sys', w, h);
    }
    post({cmd:'resize', w, h});
    sizeFitDone=true;
    requestAnimationFrame(()=>{
      if(mode==='sys'){
        const again=fitSysWindowSize();
        post({cmd:'resize', w:again.w, h:again.h});
        persistModeSize('sys', again.w, again.h);
      }else{
        ensureMiniNoClip(w, h);
      }
    });
  };
  requestAnimationFrame(()=>requestAnimationFrame(apply));
}

function renderMiniTabs(){
  const el=document.getElementById('miniTabs');
  if(!el) return;
  const cats=categories();
  const active=activeStockTab();
  el.innerHTML='';
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.textContent=cat;
    if(cat===active) btn.classList.add('active');
    btn.addEventListener('click', e=>{
      e.preventDefault();
      e.stopPropagation();
      setStockTab(cat);
    });
    el.appendChild(btn);
  });
}

function renderMini(){
  const grid=document.getElementById('miniGrid');
  const mini=document.getElementById('mini');
  const mode=locked?'sys':viewMode;
  mini.dataset.mode=mode;
  root.setAttribute('data-view', mode);
  grid.innerHTML='';

  function cell(k,v,extraHtml,mkt){
    const d=document.createElement('div');
    d.className='mini-cell'+(mkt==='tw'?' mkt-tw':'');
    d.innerHTML=`<span class="k">${k}</span><span class="v">${v}</span>${extraHtml||''}`;
    grid.appendChild(d);
  }

  if(mode==='sys'){
    mini.classList.remove('cols-2');
    cell('上傳:', quotes.UP || quotes.up || '0.00 KB/s');
    cell('下載:', quotes.DOWN || quotes.down || '0.00 KB/s');
    cell('CPU:', (quotes.CPU ?? quotes.cpu ?? '--')+' %');
    cell('記憶體:', (quotes.RAM ?? quotes.ram ?? '--')+' %');
  }else{
    renderMiniTabs();
    const list=symbolsInCategory();
    if(!list.length){
      cell('（空）', activeStockTab());
    }else{
      list.forEach(s=>{
        const q=quoteDetail(s.id);
        const pct=fmtPct(q.changePercent);
        const sess=q.session||'休市';
        const mkt=marketKind(s);
        const extra=`<span class="chg ${pct.cls}">${pct.text}</span><span class="sess ${sessClass(sess)}">${sess}</span>`;
        cell((s.label||s.id)+':', fmt(q.price, s.prefix||''), extra, mkt);
      });
    }
  }
  applyLockUi();
  syncDisplayUi();
}

function flashHint(text){
  const mini=document.getElementById('mini');
  const hint=document.getElementById('miniHint');
  hint.textContent=text;
  mini.classList.add('show-hint');
  clearTimeout(flashHint._t);
  flashHint._t=setTimeout(()=>mini.classList.remove('show-hint'), 1200);
}

function toggleView(){
  if(locked){
    flashHint('已鎖定');
    return;
  }
  // 離開前先記住目前模式尺寸，再套用另一模式自己的尺寸
  rememberCurrentWindow(currentMode());
  viewMode=viewMode==='sys'?'stock':'sys';
  localStorage.setItem('holdvue-view', viewMode);
  sizeFitDone=false;
  renderMini();
  // 兩邊切換都重新套用（股票會智能收斂寬度）
  resizeForMode(true);
}

function setLocked(on){
  locked=!!on;
  localStorage.setItem('holdvue-lock', locked?'1':'0');
  if(locked){
    viewMode='sys';
    localStorage.setItem('holdvue-view', 'sys');
    flashHint('安全鎖定');
  }else{
    flashHint('已解鎖');
  }
  sizeFitDone=false;
  renderMini();
  resizeForMode(true);
}

function onMiniClick(){
  const now=Date.now();
  clickTimes=clickTimes.filter(t=>now-t<TRIPLE_MS);
  clickTimes.push(now);
  if(clickTimes.length>=3){
    clickTimes=[];
    setLocked(!locked);
    return;
  }
  // defer single-click toggle slightly so triple can cancel
  clearTimeout(onMiniClick._t);
  onMiniClick._t=setTimeout(()=>{
    if(clickTimes.length===1){
      clickTimes=[];
      toggleView();
    }
  }, TRIPLE_MS);
}

/* Drag vs click */
function bindDragRegion(el, opts){
  if(!el) return;
  const onClick=opts&&opts.onClick;
  let down=null, dragged=false;
  el.addEventListener('pointerdown', e=>{
    if(e.button!==0) return;
    if(e.target.closest && e.target.closest('button, a, input, select, textarea, label')) return;
    down={x:e.clientX, y:e.clientY};
    dragged=false;
    try{ el.setPointerCapture(e.pointerId); }catch{}
  });
  el.addEventListener('pointermove', e=>{
    if(!down && !dragged) return;
    if(down && !dragged){
      const dx=e.clientX-down.x, dy=e.clientY-down.y;
      if((dx*dx+dy*dy)>36){
        dragged=true;
        post({cmd:'drag'});
        down=null;
      }
      return;
    }
    if(dragged) post({cmd:'dragMove'});
  });
  el.addEventListener('pointerup', e=>{
    if(e.button!==0) return;
    try{ el.releasePointerCapture(e.pointerId); }catch{}
    if(dragged){
      post({cmd:'dragEnd'});
      dragged=false;
      down=null;
      return;
    }
    if(down && !dragged && onClick) onClick(e);
    down=null;
  });
  el.addEventListener('pointercancel', e=>{
    try{ el.releasePointerCapture(e.pointerId); }catch{}
    if(dragged) post({cmd:'dragEnd'});
    dragged=false;
    down=null;
  });
}

(function bindMiniInteract(){
  const mini=document.getElementById('mini');
  bindDragRegion(mini, { onClick: ()=>onMiniClick() });
  mini.addEventListener('contextmenu', e=>{
    e.preventDefault();
    e.stopPropagation();
    post({cmd:'menu', locked: locked ? 1 : 0});
  });
  // 股票模式：高度不足時用滾輪瀏覽（不顯示捲軸）
  mini.addEventListener('wheel', e=>{
    if(currentMode()!=='stock') return;
    const grid=document.getElementById('miniGrid');
    if(!grid || grid.scrollHeight<=grid.clientHeight+1) return;
    grid.scrollTop+=e.deltaY;
    e.preventDefault();
  }, {passive:false});
  // 完整設定頁：拖標題列區域
  bindDragRegion(document.querySelector('.full .hero'));

  // Electron：僅左下／右下角縮放（原生殼由系統游標處理）
  document.querySelectorAll('.resize-handle').forEach(handle=>{
    let active=false;
    handle.addEventListener('pointerdown', e=>{
      if(e.button!==0) return;
      e.preventDefault();
      e.stopPropagation();
      active=true;
      try{ handle.setPointerCapture(e.pointerId); }catch{}
      post({cmd:'resizeStart', edge: handle.dataset.edge});
    });
    handle.addEventListener('pointermove', ()=>{
      if(active){
        post({cmd:'resizeMove'});
        syncStockColsToWidth(false);
      }
    });
    handle.addEventListener('pointerup', e=>{
      if(!active) return;
      active=false;
      try{ handle.releasePointerCapture(e.pointerId); }catch{}
      post({cmd:'resizeEnd'});
      syncStockColsToWidth(true);
      rememberCurrentWindow();
    });
    handle.addEventListener('pointercancel', ()=>{
      if(!active) return;
      active=false;
      post({cmd:'resizeEnd'});
      syncStockColsToWidth(true);
      rememberCurrentWindow();
    });
  });
})();

function renameCategory(i, name){
  const cats=categories();
  const old=cats[i];
  const next=String(name||'').trim();
  if(!next){ toast('分類名稱不可空白', false); return; }
  if(cats.some((c,idx)=>idx!==i && c===next)){ toast('分類名稱重複', false); return; }
  cats[i]=next;
  cfg.categories=cats;
  (cfg.symbols||[]).forEach(s=>{ if(s.category===old) s.category=next; });
  if(stockTab===old){ stockTab=next; localStorage.setItem('holdvue-stock-tab', stockTab); }
  renderCatList(); renderTable(); renderBoard();
  toast('分類已重新命名（記得儲存）', true);
}

function removeCategory(i){
  const cats=categories();
  if(cats.length<=1){ toast('至少保留一個分類', false); return; }
  const removed=cats[i];
  cats.splice(i,1);
  cfg.categories=cats;
  const fallback=cats[0];
  (cfg.symbols||[]).forEach(s=>{ if(s.category===removed) s.category=fallback; });
  if(stockTab===removed){ stockTab=fallback; localStorage.setItem('holdvue-stock-tab', stockTab); }
  renderCatList(); renderTable(); renderBoard();
  toast('已刪除分類（記得儲存）', true);

function reorderSymbolsByCategory(){
  const cats=categories();
  const known=new Set(cats);
  const buckets=Object.fromEntries(cats.map(c=>[c,[]]));
  const orphan=[];
  (cfg.symbols||[]).forEach(s=>{
    if(s.category && buckets[s.category]) buckets[s.category].push(s);
    else if(s.category && known.has(s.category)) buckets[s.category].push(s);
    else orphan.push(s);
  });
  cfg.symbols=cats.flatMap(c=>buckets[c]||[]).concat(orphan);
}

/* ===== 名稱／代碼字典與延遲自動帶入 ===== */
const AUTOFILL_DELAY_MS=750;
let symbolDict={tw:[], us:[], coin:[]};
let autofill={
  timer:null,
  from:null,
  filledLabel:null,
  filledCode:null,
  lockedLabel:false,
  lockedCode:false
};

function resetAutofillState(){
  clearTimeout(autofill.timer);
  autofill.timer=null;
  autofill.from=null;
  autofill.filledLabel=null;
  autofill.filledCode=null;
  autofill.lockedLabel=false;
  autofill.lockedCode=false;
  const hint=document.getElementById('autofillHint');
  if(hint){ hint.textContent='輸入名稱或代碼後稍候，會自動帶入對應欄位'; hint.classList.remove('hit'); }
}

function normKey(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,'');
}

function dictEntries(prefer){
  const order=prefer==='coin'?['coin','tw','us']
    :prefer==='us'?['us','tw','coin']
    :prefer==='tw'?['tw','us','coin']
    :['tw','us','coin'];
  const out=[];
  order.forEach(k=>{
    (symbolDict[k]||[]).forEach(e=>out.push({...e, market:k}));
  });
  return out;
}

function scoreDictHit(query, entry){
  const q=normKey(query);
  if(!q) return 0;
  const label=normKey(entry.label);
  const code=normKey(entry.code);
  const codeNoSuf=code.replace(/\.tw$|\.two$/i,'');
  const aliases=(entry.aliases||[]).map(normKey);
  if(q===label || q===code || q===codeNoSuf || aliases.includes(q)) return 100;
  if(label.startsWith(q) || code.startsWith(q) || codeNoSuf.startsWith(q)) return 80;
  if(aliases.some(a=>a.startsWith(q))) return 75;
  if(q.length>=2 && (label.includes(q) || code.includes(q) || codeNoSuf.includes(q))) return 55;
  if(q.length>=2 && aliases.some(a=>a.includes(q))) return 50;
  // 台股純數字：0050 / 2330
  if(/^\d{4,6}[a-z]?$/i.test(q) && (codeNoSuf===q || label===q)) return 95;
  return 0;
}

function lookupSymbol(query, prefer){
  const q=String(query||'').trim();
  if(q.length<1) return null;
  let best=null, bestScore=0;
  dictEntries(prefer).forEach(e=>{
    const sc=scoreDictHit(q, e);
    if(sc>bestScore){ bestScore=sc; best=e; }
  });
  // 短字串只接受高信心；避免輸入中被頻繁誤帶
  if(!best) return null;
  if(q.length<=1 && bestScore<100) return null;
  if(q.length===2 && bestScore<80) return null;
  if(bestScore<55) return null;
  return best;
}

function preferMarketFromForm(){
  const src=document.getElementById('newSource')?.value;
  const cat=document.getElementById('newCategory')?.value||'';
  if(src==='coingecko' || /coin|crypto|幣/i.test(cat)) return 'coin';
  if(/^us$/i.test(cat) || /美/i.test(cat)) return 'us';
  if(/^tw$/i.test(cat) || /台/i.test(cat)) return 'tw';
  return null;
}

function applyDictHit(hit, from){
  if(!hit) return;
  const labelEl=document.getElementById('newLabel');
  const codeEl=document.getElementById('newCode');
  const sourceEl=document.getElementById('newSource');
  const catEl=document.getElementById('newCategory');
  const prefixEl=document.getElementById('newPrefix');
  const hint=document.getElementById('autofillHint');

  const catMap={tw:'TW', us:'US', coin:'Coin'};
  const wantCat=catMap[hit.market]||hit.market;
  const cats=categories();
  const resolvedCat=cats.includes(wantCat)?wantCat:(cats.find(c=>c.toLowerCase()===wantCat.toLowerCase())||cats[0]);

  if(from==='label'){
    // 輸入名稱 → 只自動帶入代碼（名稱保留使用者輸入，方便繼續修改）
    if(!autofill.lockedCode){
      codeEl.value=hit.code;
      autofill.filledCode=hit.code;
    }
  }else{
    // 輸入代碼 → 只自動帶入名稱；代碼可正規化為字典標準寫法
    if(!autofill.lockedLabel){
      labelEl.value=hit.label;
      autofill.filledLabel=hit.label;
    }
    if(!autofill.lockedCode){
      codeEl.value=hit.code;
      autofill.filledCode=hit.code;
    }
  }

  if(sourceEl) sourceEl.value=hit.market==='coin'?'coingecko':'yahoo';
  if(catEl && resolvedCat) catEl.value=resolvedCat;
  if(prefixEl){
    if(hit.prefix) prefixEl.value=hit.prefix;
    else if(hit.market==='coin' && !prefixEl.value) prefixEl.value='$';
  }
  if(hint){
    hint.textContent=`已帶入：${hit.label} ↔ ${hit.code}`+(hit.aliases&&hit.aliases[0]?`（${hit.aliases[0]}）`:'');
    hint.classList.add('hit');
  }
}

function scheduleAutofill(from){
  clearTimeout(autofill.timer);
  autofill.from=from;
  autofill.timer=setTimeout(()=>{
    const prefer=preferMarketFromForm();
    const q=from==='label'
      ? document.getElementById('newLabel').value
      : document.getElementById('newCode').value;
    const hit=lookupSymbol(q, prefer);
    if(hit) applyDictHit(hit, from);
  }, AUTOFILL_DELAY_MS);
}

function bindAutofillInputs(){
  const labelEl=document.getElementById('newLabel');
  const codeEl=document.getElementById('newCode');
  if(!labelEl || !codeEl || labelEl.dataset.autofillBound) return;
  labelEl.dataset.autofillBound='1';
  codeEl.dataset.autofillBound='1';

  labelEl.addEventListener('input', ()=>{
    if(autofill.filledLabel!=null && labelEl.value.trim()!==autofill.filledLabel){
      autofill.lockedLabel=true;
    }
    // 手動改名稱時，若代碼仍是舊自動值，允許之後重新帶入
    if(autofill.filledCode!=null && codeEl.value.trim()===autofill.filledCode){
      autofill.lockedCode=false;
    }
    scheduleAutofill('label');
  });
  codeEl.addEventListener('input', ()=>{
    if(autofill.filledCode!=null && codeEl.value.trim()!==autofill.filledCode){
      autofill.lockedCode=true;
    }
    if(autofill.filledLabel!=null && labelEl.value.trim()===autofill.filledLabel){
      autofill.lockedLabel=false;
    }
    scheduleAutofill('code');
  });
  // 輸入中先取消計時，停頓後再帶入
  const bump=(from)=>()=>{
    clearTimeout(autofill.timer);
    scheduleAutofill(from);
  };
  labelEl.addEventListener('keydown', ()=>clearTimeout(autofill.timer));
  codeEl.addEventListener('keydown', ()=>clearTimeout(autofill.timer));
  labelEl.addEventListener('keyup', bump('label'));
  codeEl.addEventListener('keyup', bump('code'));
}

async function loadSymbolDict(){
  try{
    const data=await (await fetch('/symbol-dict.json')).json();
    symbolDict={
      tw:Array.isArray(data.tw)?data.tw:[],
      us:Array.isArray(data.us)?data.us:[],
      coin:Array.isArray(data.coin)?data.coin:[]
    };
  }catch{
    symbolDict={tw:[], us:[], coin:[]};
  }
}

async function testPayload(item){const res=await fetch('/api/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)}); const data=await res.json(); if(!data.ok) throw new Error(data.error||'驗證失敗'); return data;}
async function testNew(){try{const d=await testPayload(readNew()); testToast(`連線成功：${d.symbol} = ${d.price}`,true);}catch(e){testToast(e.message,false);}}
function rowToast(msgTr, msg, ok){
  if(!msgTr) return;
  msgTr.classList.add('show');
  const el=msgTr.querySelector('.row-toast');
  if(!el) return;
  el.textContent=msg;
  el.className='row-toast '+(ok?'ok':'bad');
}
async function testRow(i, msgTr){
  try{
    rowToast(msgTr, '驗證中…', true);
    const d=await testPayload(cfg.symbols[i]);
    rowToast(msgTr, `${cfg.symbols[i].label}: ${d.symbol} = ${d.price}`, true);
  }catch(e){
    rowToast(msgTr, e.message, false);
  }
}
async function saveConfig(){
  cfg=ensureCategories(cfg);
  reorderSymbolsByCategory();
  cfg.symbols=(cfg.symbols||[]).map(s=>{
    if(s&&s.yahoo) s.yahoo=normalizeYahooSymbol(s.yahoo);
    return s;
  });
  const res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
  const data=await res.json(); if(!data.ok){toast(data.error||'儲存失敗',false);return;}
  toast(data.warn ? ('已儲存（報價更新有警告）') : '已儲存，報價已更新', true);
  await loadConfig();
  await refreshQuotes();
}
async function loadConfig(){
  cfg=ensureCategories(await (await fetch('/api/config')).json());
  reorderSymbolsByCategory();
  renderCatList();
  renderTable();
  renderMini();
}
async function refreshQuotes(){
  quotes=await (await fetch('/api/quotes')).json();
  renderBoard();
}
async function refreshAll(){
  await loadConfig();
  try{ await fetch('/api/refresh',{method:'POST'}); }catch{}
  await refreshQuotes();
}
bindAutofillInputs();
loadSymbolDict();
refreshAll().then(()=>{
  requestPrefs();
  if(isWidget){
    sizeFitDone=false;
    resizeForMode(true);
  }
});
setInterval(refreshQuotes,5000);
if(isWidget) post({cmd:'ready'});
</script>
